apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: inference-monitoring

resources:
  - ../../base
  - model-storage.yaml
  - model-json-configmap.yaml
  - triton-deployment.yaml

patches:
  - path: mcp-agent-patch.yaml
    target:
      kind: Deployment
      name: mcp-agent

# The tag is bumped automatically by the CI/CD pipeline (gitops-bump job).
images:
  - name: mcp-agent
    newName: ghcr.io/shengan01/mcp-agent
    newTag: ac02a6c28f5000f2677082b883bcb2a583d39aa9

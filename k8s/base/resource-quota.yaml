apiVersion: v1
kind: ResourceQuota
metadata:
  name: inference-monitoring-quota
  namespace: inference-monitoring
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    persistentvolumeclaims: "5"
    pods: "15"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: inference-monitoring-limits
  namespace: inference-monitoring
spec:
  limits:
    - default:
        cpu: "1000m"
        memory: "1024Mi"
      defaultRequest:
        cpu: "100m"
        memory: "256Mi"
      type: Container

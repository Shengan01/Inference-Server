apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inference-monitoring-ingress
  namespace: inference-monitoring
  labels:
    app.kubernetes.io/name: inference-ingress
    app.kubernetes.io/part-of: inference-monitoring
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
spec:
  rules:
    - host: inference.local
      http:
        paths:
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana-service
                port:
                  number: 3000
          - path: /v2
            pathType: Prefix
            backend:
              service:
                name: triton-service
                port:
                  number: 8000
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: mcp-agent-service
                port:
                  number: 5000

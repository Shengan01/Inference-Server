apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: inference-monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: inference-monitoring
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-service:9090
        uid: prometheus
        isDefault: true
        editable: false

apiVersion: v1
kind: Service
metadata:
  name: triton-service
  namespace: inference-monitoring
  labels:
    app.kubernetes.io/name: triton-server
    app.kubernetes.io/part-of: inference-monitoring
spec:
  type: ClusterIP
  ports:
    - name: http-inference
      port: 8000
      targetPort: 8000
    - name: grpc-inference
      port: 8001
      targetPort: 8001
    - name: metrics
      port: 8002
      targetPort: 8002
  selector:
    app.kubernetes.io/name: triton-server

apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton-server
  namespace: inference-monitoring
  labels:
    app.kubernetes.io/name: triton-server
    app.kubernetes.io/part-of: inference-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: triton-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: triton-server
        app.kubernetes.io/part-of: inference-monitoring
    spec:
      serviceAccountName: triton-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mock-triton-server
          image: python:3.11-slim
          command: ["python3", "-u", "/app/mock_triton_server.py", "8000"]
          ports:
            - name: http-inference
              containerPort: 8000
            - name: metrics
              containerPort: 8002
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /v2/health/ready
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /v2/health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: script-vol
              mountPath: /app/mock_triton_server.py
              subPath: mock_triton_server.py
      volumes:
        - name: script-vol
          configMap:
            name: mock-triton-script
            defaultMode: 0755

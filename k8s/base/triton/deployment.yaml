apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton-server
  namespace: inference-monitoring
  labels:
    app.kubernetes.io/name: triton-server
    app.kubernetes.io/part-of: inference-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: triton-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: triton-server
        app.kubernetes.io/part-of: inference-monitoring
    spec:
      serviceAccountName: triton-sa
      securityContext:
        runAsNonRoot: false  # Triton requires root or specific UID
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: triton-server
          image: nvcr.io/nvidia/tritonserver:24.06-vllm-python-py3
          command: ["tritonserver"]
          args:
            - "--model-repository=/model_repository"
            - "--model-control-mode=explicit"
            - "--load-model=finance-qwen"
            - "--http-port=8000"
            - "--grpc-port=8001"
            - "--metrics-port=8002"
            - "--log-verbose=1"
          ports:
            - name: http
              containerPort: 8000
            - name: grpc
              containerPort: 8001
            - name: metrics
              containerPort: 8002
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 12Gi
              nvidia.com/gpu: 1
          readinessProbe:
            httpGet:
              path: /v2/health/ready
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /v2/health/live
              port: 8000
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - name: model-repository
              mountPath: /model_repository
      volumes:
        - name: model-repository
          emptyDir: {}

apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: inference-monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: inference-monitoring
data:
  alertmanager.yml: |
    route:
      receiver: default
      group_by: [alertname, severity]
      group_wait: 5s
      group_interval: 30s
      repeat_interval: 1h
    receivers:
      # No external notifier is configured; alerts are visible in the
      # Alertmanager UI and in Prometheus. Add webhook/email configs here.
      - name: default

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: inference-monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: inference-monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 1s
      evaluation_interval: 1s
      scrape_timeout: 1s

    rule_files:
      - /etc/prometheus/rules/*.yaml

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'triton'
        static_configs:
          - targets: ['triton-service:8002']
        metrics_path: /metrics
        scrape_interval: 1s

      - job_name: 'mcp_agent_config'
        static_configs:
          - targets: ['mcp-agent-service:5000']
        metrics_path: /metrics/config
        scrape_interval: 2s

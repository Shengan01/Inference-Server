# Example Secret manifests. NOT part of any kustomization and NOT deployed from Git:
# real credentials must never be committed. The live objects are created by
# scripts/bootstrap_secrets.sh (random Grafana password, self-signed TLS certificate).
# Replace the placeholders only if you create the Secrets by hand:
#   kubectl apply -f k8s/examples/secrets.example.yaml
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secret
  namespace: inference-monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: inference-monitoring
type: Opaque
stringData:
  admin-user: admin
  admin-password: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: inference-tls
  namespace: inference-monitoring
  labels:
    app.kubernetes.io/part-of: inference-monitoring
type: kubernetes.io/tls
stringData:
  tls.crt: CHANGE_ME_PEM_CERTIFICATE
  tls.key: CHANGE_ME_PEM_PRIVATE_KEY

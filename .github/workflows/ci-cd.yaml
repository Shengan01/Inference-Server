name: "CI/CD & Security Pipeline"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Least privilege by default; jobs that need more declare it themselves.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/shengan01/mcp-agent

# One pipeline per branch at a time (the GitOps job pushes back to main)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

# bash with -e -o pipefail, so a failing command before a pipe (| tee) fails the step
defaults:
  run:
    shell: bash

jobs:
  # ========================================================
  # STAGE 1: LINT + RENDER + SCHEMA VALIDATION
  # ========================================================
  lint-and-validate:
    name: "Lint, Render & Validate K8s Manifests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "YAML lint"
        run: |
          sudo apt-get update && sudo apt-get install -y yamllint shellcheck
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}}}" k8s/ .github/

      - name: "Shellcheck scripts"
        run: shellcheck scripts/*.sh

      - name: "Python syntax check"
        run: python3 -m py_compile mcp_agent/server.py scripts/test_k8s_simulation.py scripts/mock_triton_server.py

      - name: "Install kubeconform"
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: "Render every overlay with kustomize and validate schemas"
        run: |
          for dir in k8s/base k8s/overlays/cpu-demo k8s/overlays/gpu k8s/overlays/local-cpu k8s/overlays/local-gpu k8s/addons/operator-stack; do
            echo "::group::$dir"
            kubectl kustomize "$dir" | kubeconform -summary -strict -ignore-missing-schemas \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            echo "::endgroup::"
          done
          kubeconform -summary -strict k8s/tests/

  # ========================================================
  # STAGE 2: SECURITY SCANNING OF MANIFESTS (TRIVY)
  # ========================================================
  security-audit:
    name: "Security & Misconfiguration Audit"
    runs-on: ubuntu-latest
    needs: lint-and-validate
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: "Trivy IaC scan (fails on CRITICAL)"
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          version: 'v0.76.1'
          scan-type: 'config'
          scan-ref: 'k8s/'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'

      - name: "Trivy IaC scan (report HIGH, SARIF)"
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          version: 'v0.76.1'
          scan-type: 'config'
          scan-ref: 'k8s/'
          format: 'sarif'
          output: 'trivy-config.sarif'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'

      - name: "Upload SARIF"
        if: github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-config.sarif

  # ========================================================
  # STAGE 3: INTEGRATION TEST ON A REAL (KIND) CLUSTER
  # ========================================================
  integration-test:
    name: "Deploy to kind & run test procedure"
    runs-on: ubuntu-latest
    needs: lint-and-validate
    steps:
      - uses: actions/checkout@v4

      - name: "Create kind cluster"
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: ci

      - name: "Build MCP agent image and load into kind"
        run: |
          docker build -t mcp-agent:local ./mcp_agent
          kind load docker-image mcp-agent:local --name ci

      - name: "Deploy (local-cpu overlay)"
        run: |
          ./scripts/bootstrap_secrets.sh
          kubectl apply -k k8s/overlays/local-cpu
          kubectl -n inference-monitoring rollout status statefulset/prometheus --timeout=240s
          for d in grafana alertmanager mcp-agent triton-server; do
            kubectl -n inference-monitoring rollout status deployment/$d --timeout=240s
          done
          kubectl -n inference-monitoring get pods,pvc,svc,ingress

      - name: "Security audit script"
        run: ./scripts/verify_security.sh

      - name: "Grafana reachable under /grafana"
        run: |
          kubectl -n inference-monitoring port-forward svc/grafana-service 3000:3000 &
          sleep 5
          curl -fsS http://localhost:3000/grafana/api/health

      - name: "Run load / alert / hot-reload test procedure (in-cluster Job)"
        run: LOADGEN_IMAGE=mcp-agent:local OUT_DIR=. ./scripts/run_in_cluster_test.sh

      - name: "Dump cluster state on failure"
        if: failure()
        run: |
          kubectl -n inference-monitoring get all,events || true
          kubectl -n inference-monitoring logs --all-containers --tail=100 -l app.kubernetes.io/part-of=inference-monitoring || true

      - name: "Upload test report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            test-report.json
            test-output.log

  # ========================================================
  # STAGE 4: BUILD, SCAN AND PUSH IMAGE
  # ========================================================
  build-scan-push:
    name: "Build, Scan & Push MCP Agent"
    runs-on: ubuntu-latest
    needs: [security-audit, integration-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: "Build image (local, for scanning)"
        uses: docker/build-push-action@v6
        with:
          context: ./mcp_agent
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: "Trivy image scan"
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          version: 'v0.76.1'
          image-ref: '${{ env.IMAGE }}:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Push image"
        uses: docker/build-push-action@v6
        with:
          context: ./mcp_agent
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  # ========================================================
  # STAGE 5: GITOPS - BUMP IMAGE TAG IN GIT (ARGOCD RECONCILES)
  # ========================================================
  gitops-bump:
    name: "GitOps: update image tag in overlays"
    runs-on: ubuntu-latest
    needs: build-scan-push
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: "Set new image tag in overlays"
        run: |
          for f in k8s/overlays/cpu-demo/kustomization.yaml k8s/overlays/gpu/kustomization.yaml; do
            sed -i "s|^\(\s*newTag:\).*|\1 ${{ github.sha }}|" "$f"
          done
          kubectl kustomize k8s/overlays/cpu-demo | grep "image: ${IMAGE}:${{ github.sha }}"

      - name: "Commit and push (ArgoCD detects the change)"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays
          git diff --cached --quiet && exit 0
          git commit -m "ci: deploy mcp-agent ${{ github.sha }} [skip ci]"
          # main may have moved while the pipeline ran
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
